# Rule-by-rule status against the Home Assistant integration quality scale.
# A HACS-distributed integration sits in the Custom tier and can be awarded no
# badge; Platinum is the build target. Every exemption states its reason.
rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers; the cast_delivery_result event is documented under docs-actions.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: Inherited from core cast, which has nothing to test at configure time; devices are discovered after setup.
  test-before-setup:
    status: exempt
    comment: Inherited from core cast; discovery starts after setup and a missing device is not a setup failure.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Cast devices have no credentials.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: done
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: The two health sensors are the reason the fork exists and must be visible by default; the group leader sensor is diagnostic and small.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: Inherited from core cast; the single config entry has nothing to reconfigure beyond the options flow.
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency:
    status: exempt
    comment: pychromecast is thread-based; the asyncio rewrite (pychromecast PR 1048) has been open since April 2025 with maintainer reservations. Every call into the library runs in the executor behind an asyncio watchdog and every callback is marshalled onto the event loop; see DESIGN.md sections 6 and 7.
  inject-websession: done
  strict-typing: done

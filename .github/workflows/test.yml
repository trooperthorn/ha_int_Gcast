# Runs lint, type check, and the pytest suite on every push and pull request.
# release.yml calls this workflow so the same jobs gate every GitHub Release.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the test harness
        run: pip install -r requirements-dev.txt
      - name: Verify runtime versions
        run: python -c "from importlib.metadata import version; import sys; print(version('homeassistant')); assert version('homeassistant') == '2026.10.1'; assert sys.version_info[:2] == (3, 14)"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy --config-file mypy.ini custom_components/cast
      - name: Run the suite
        run: pytest -ra --strict-markers tests/
      - name: Validate the release version fields
        run: python3 scripts/build_release_artifacts.py --validate-only
